<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admissions Management Portal | Olistar School</title>
    <link rel="stylesheet" href="vendor/bootstrap/css/bootstrap.min.css">
    <link rel="stylesheet" href="vendor/bootstrap-icons/bootstrap-icons.css">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-light">

    <!-- Navbar -->
    <nav class="navbar navbar-dark bg-dark border-bottom border-warning border-3">
        <div class="container-fluid px-4">
            <span class="navbar-brand font-serif fw-bold text-warning">
                <i class="bi bi-shield-lock-fill me-2"></i> Olistar School Admin Portal
            </span>
            <span class="text-white-50 small">Sunyani Abesim</span>
        </div>
    </nav>

    <div class="container-fluid px-4 py-4">
        <!-- Header Controls -->
        <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center mb-4 pb-3 border-bottom">
            <div>
                <h2 class="font-serif fw-bold text-dark mb-1">Admissions Dashboard</h2>
                <p class="text-muted small mb-0">Review incoming submissions and update status in real time.</p>
            </div>
            <div class="d-flex gap-2 mt-3 mt-md-0">
                <select id="statusFilter" class="form-select rounded-0 border-dark">
                    <option value="All">All Statuses</option>
                    <option value="Pending">Pending</option>
                    <option value="Interview Scheduled">Interview Scheduled</option>
                    <option value="Approved">Approved</option>
                    <option value="Rejected">Rejected</option>
                </select>
            </div>
        </div>

        <!-- Table Container -->
        <div class="card rounded-0 border-dark shadow-sm">
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="table-dark text-uppercase small">
                            <tr>
                                <th scope="col" class="py-3 px-3">Ref Code</th>
                                <th scope="col" class="py-3">Applicant Name</th>
                                <th scope="col" class="py-3">Division / Stream</th>
                                <th scope="col" class="py-3">Guardian Contact</th>
                                <th scope="col" class="py-3">Documents</th>
                                <th scope="col" class="py-3">Status</th>
                                <th scope="col" class="py-3 px-3">Action</th>
                            </tr>
                        </thead>
                        <tbody id="applicationsTableBody">
                            <tr>
                                <td colspan="7" class="text-center py-5">
                                    <div class="spinner-border text-danger" role="status">
                                        <span class="visually-hidden">Loading...</span>
                                    </div>
                                    <p class="text-muted mt-2 mb-0">Fetching submissions...</p>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script src="vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="js/admin.js"></script>
</body>
</html>
