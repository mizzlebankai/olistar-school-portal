<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | Olistar School Portal</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        body {
            background-color: #212529;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            max-width: 420px;
            width: 100%;
        }
    </style>
</head>
<body>

    <div class="container px-3">
        <!-- TOP NAVIGATION TO MAIN WEBSITE -->
        <div class="text-center mb-3">
            <a href="index.html" class="text-white-50 text-decoration-none small">
                <i class="bi bi-arrow-left me-1"></i> Return to Main Website
            </a>
        </div>

        <!-- LOGIN CARD -->
        <div class="card bg-dark text-white border-warning border-2 rounded-0 shadow-lg login-card mx-auto">
            <div class="card-body p-4 p-md-5">
                
                <div class="text-center mb-4">
                    <i class="bi bi-shield-lock text-warning display-4"></i>
                    <h3 class="fw-bold mt-2 text-warning">Admin Portal</h3>
                    <p class="text-white-50 small">Sign in with your administrative credentials</p>
                </div>

                <div id="loginError" class="alert alert-danger py-2 small d-none" role="alert"></div>

                <form id="loginForm">
                    <div class="mb-3">
                        <label for="loginEmail" class="form-label text-uppercase small fw-bold">Email Address</label>
                        <input type="email" class="form-control rounded-0 border-secondary" id="loginEmail" required placeholder="admin@olistar.edu.gh">
                    </div>

                    <div class="mb-4">
                        <label for="loginPassword" class="form-label text-uppercase small fw-bold">Password</label>
                        <input type="password" class="form-control rounded-0 border-secondary" id="loginPassword" required placeholder="••••••••">
                    </div>

                    <button type="submit" class="btn btn-warning w-100 rounded-0 fw-bold text-uppercase py-2">Log In</button>
                </form>

            </div>
            <div class="card-footer bg-dark border-top border-secondary text-center py-3">
                <a href="index.html" class="small text-warning text-decoration-none">
                    <i class="bi bi-house me-1"></i> Home Page
                </a>
            </div>
        </div>
    </div>

    <!-- JavaScript Module -->
    <script type="module" src="js/admin-login.js?v=2"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
